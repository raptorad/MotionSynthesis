<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Motion Synthesis - Ludzik 2D</title>
  <style>
    body {
      margin: 0;
      background: #516592;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      color: #eee;
      flex-direction: column;
    }
    canvas {
      background: #16213e;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(100, 150, 255, 0.3);
    }
    .controls {
      margin-top: 20px;
      flex-direction: column;
      justify-content: space-between;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .controls label {
      display: flex;
      align-items: center; 
      gap: 10px;
      width: 380px;
      justify-content: space-between;
    }
    .controls label span.label-text {
      width: 110px;
      text-align: left;
    }
    .controls label span.value-display {
      width: 40px;
      text-align: right;
      font-weight: bold;
      color: #4ecdc4;
    }
    .presets {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    .presets button {
      background: #4ecdc4;
      border: none;
      color: #16213e;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .presets button:hover {
      background: #3bb2aa;
    }
    .presets button:active {
      transform: scale(0.96);
    }
    .sign{
      margin-top: 20px;
    }
    input[type="range"] { width: 180px; }
  </style>
</head>
<body>
  <canvas id="canvas" width="500" height="500"></canvas>
  
  <div class="presets" id="presetContainer">
    <!-- Przycisk generowane automatycznie -->
  </div>

  <div class="controls">
    <label>
      <span class="label-text">Speed:</span>
      <input type="range" id="speed" min="0" max="5" step="0.1" value="1.5">
      <span class="value-display" id="val-speed">1.5</span>
    </label>
    <label>
      <span class="label-text">Height:</span>
      <input type="range" id="torsoHeight" min="0" max="20" step="0.1" value="2">
      <span class="value-display" id="val-torsoHeight">2.0</span>
    </label>
    <label>
      <span class="label-text">Amp legs:</span>
      <input type="range" id="ampLegs" min="0" max="2.8" step="0.1" value="1">
      <span class="value-display" id="val-ampLegs">1.0</span>
    </label>
    <label>
      <span class="label-text">Amp knees:</span>
      <input type="range" id="ampKnees" min="0" max="2.5" step="0.1" value="1">
      <span class="value-display" id="val-ampKnees">1.0</span>
    </label>
    <label>
      <span class="label-text">Amp torso:</span>
      <input type="range" id="ampTorso" min="0" max="2.5" step="0.1" value="1">
      <span class="value-display" id="val-ampTorso">1.0</span>
    </label>
    <label>
      <span class="label-text">Amp arms:</span>
      <input type="range" id="ampArms" min="0" max="2.5" step="0.1" value="1">
      <span class="value-display" id="val-ampArms">1.0</span>
    </label>
    <label>
      <span class="label-text">Front/rear:</span>
      <input type="range" id="frontRear" min="0.5" max="1.5" step="0.1" value="1">
      <span class="value-display" id="val-frontRear">1.0</span>
    </label>
  </div>
  
  <div class="sign">
    <label>Michał Czajka 2026</label>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Middle of the canvas
const originX = canvas.width / 2;
const originY = canvas.height / 2;

let AMPLITUDES = {
  legs: 1,
  knees: 1,
  torso: 1,
  arms: 1,
};

// Body elements proportions (pixels)
const BODY = {
  torso: 60,      
  headRadius: 18,
  upperArm: 35,
  lowerArm: 35,
  upperLeg: 45,
  lowerLeg: 45,
};

// State of animation
let phase = 0;          // movement phase (rises over time)
let speedMultiplier = 1.5;
let jumpHeight = 2;
let frontRear = 0.5;
let rearFront = 0.5;

// --- PRESET SYSTEM ---
const PRESETS = [
  {
    name: "Walk",
    settings: {
      speed: 1.2,
      torsoHeight: 2.0,
      legs: 0.8,
      knees: 0.8,
      torso: 0.8,
      arms: 0.8,
      frontRear: 1.0
    }
  },
  {
    name: "Jog",
    settings: {
      speed: 1.8,
      torsoHeight: 2.0,
      legs: 1.4,
      knees: 1.6,
      torso: 1.2,
      arms: 1.8,
      frontRear: 1.0
    }
  },
  {
    name: "Happy",
    settings: {
      speed: 1.4,
      torsoHeight: 2.0,
      legs: 1.2,
      knees: 1.4,
      torso: 0.8,
      arms: 1.8,
      frontRear: 1.0
    }
  },
  {
    name: "Run",
    settings: {
      speed: 3.0,
      torsoHeight: 4.0,
      legs: 1.8,
      knees: 2.2,
      torso: 1.5,
      arms: 2.0,
      frontRear: 1.0
    }
  },
  {
    name: "Run2",
    settings: {
      speed: 2.8,
      torsoHeight: 2.0,
      legs: 2.8,
      knees: 2.0,
      torso: 1.7,
      arms: 2.5,
      frontRear: 1.0
    }
  },
  {
    name: "Bounce",
    settings: {
      speed: 2.5,
      torsoHeight: 18.0,
      legs: 0.5,
      knees: 1.8,
      torso: 2.2,
      arms: 2.2,
      frontRear: 1.0
    }
  }
  
];

// Helper to update displayed numerical values
function updateDisplayValues() {
  document.getElementById('val-speed').textContent = parseFloat(document.getElementById('speed').value).toFixed(1);
  document.getElementById('val-torsoHeight').textContent = parseFloat(document.getElementById('torsoHeight').value).toFixed(1);
  document.getElementById('val-ampLegs').textContent = parseFloat(document.getElementById('ampLegs').value).toFixed(1);
  document.getElementById('val-ampKnees').textContent = parseFloat(document.getElementById('ampKnees').value).toFixed(1);
  document.getElementById('val-ampTorso').textContent = parseFloat(document.getElementById('ampTorso').value).toFixed(1);
  document.getElementById('val-ampArms').textContent = parseFloat(document.getElementById('ampArms').value).toFixed(1);
  document.getElementById('val-frontRear').textContent = parseFloat(document.getElementById('frontRear').value).toFixed(1);
}

// Helper to synchronise DOM sliders with values
function updateUI() {
  document.getElementById('speed').value = speedMultiplier;
  document.getElementById('torsoHeight').value = jumpHeight;
  document.getElementById('ampLegs').value = AMPLITUDES.legs;
  document.getElementById('ampKnees').value = AMPLITUDES.knees;
  document.getElementById('ampTorso').value = AMPLITUDES.torso;
  document.getElementById('ampArms').value = AMPLITUDES.arms;
  document.getElementById('frontRear').value = (frontRear * 2);
  
  updateDisplayValues();
}

// Function to apply a preset
function applyPreset(preset) {
  const s = preset.settings;
  
  // Set parameters
  speedMultiplier = s.speed;
  jumpHeight = s.torsoHeight;
  AMPLITUDES.legs = s.legs;
  AMPLITUDES.knees = s.knees;
  AMPLITUDES.torso = s.torso;
  AMPLITUDES.arms = s.arms;

  if (s.frontRear !== undefined) {
    frontRear = s.frontRear / 2;
    rearFront = (2 - s.frontRear) / 2;
  }

  // Reflect values in sliders and texts
  updateUI();
}

// Auto-generate buttons based on the PRESETS array
function initPresets() {
  const container = document.getElementById('presetContainer');
  container.innerHTML = '';

  PRESETS.forEach(preset => {
    const btn = document.createElement('button');
    btn.textContent = preset.name;
    btn.addEventListener('click', () => applyPreset(preset));
    container.appendChild(btn);
  });
}

// --- Helpers ---
const lerp = (a, b, t) => a + (b - a) * t;

/**
 * Draws a limb as a chain of segments (forward kinematics).
 * Angles are given in radians relative to vertical (0 = down).
 */
function drawLimb(x, y, angles, lengths, color = '#4ecdc4', width = 6) {
  let px = x, py = y;
  let cumulativeAngle = 0;
  
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px, py);
  
  for (let i = 0; i < angles.length; i++) {
    cumulativeAngle += angles[i];
    const nx = px + Math.sin(cumulativeAngle) * lengths[i];
    const ny = py + Math.cos(cumulativeAngle) * lengths[i];
    ctx.lineTo(nx, ny);
    px = nx;
    py = ny;
  }
  ctx.stroke();
  
  return { x: px, y: py };
}

/**
 * MOTION SYNTHESIS - generates joint angles based on motion phase.
 */
function synthesizePose(t) {
  const legSwing = Math.sin(t) * 0.7 * AMPLITUDES.legs * frontRear;
  const legSwingOpposite = Math.sin(t + Math.PI) * 0.7 * AMPLITUDES.legs * rearFront;
  
  const kneeBend = (s) => Math.max(0, -Math.sin(s + 0.5)) * 0.9 * AMPLITUDES.knees;
  
  const armSwingL = Math.sin(t + Math.PI) * 0.6 * AMPLITUDES.arms * rearFront;
  const armSwingR = Math.sin(t) * 0.6 * AMPLITUDES.arms * frontRear;
  
  const elbowBend = -0.3;
  
  const torsoLean = Math.sin(t * 2) * 0.03 * AMPLITUDES.torso;
  const torsoHeightOffset = Math.sin(t * 2) * jumpHeight * AMPLITUDES.torso;
  
  const headNod = Math.sin(t * 2) * 0.05 * AMPLITUDES.torso;
  
  return {
    leftLeg: {
      angles: [legSwing, kneeBend(t)],
      lengths: [BODY.upperLeg, BODY.lowerLeg],
    },
    rightLeg: {
      angles: [legSwingOpposite, kneeBend(t + Math.PI)],
      lengths: [BODY.upperLeg, BODY.lowerLeg],
    },
    leftArm: {
      angles: [armSwingL, elbowBend],
      lengths: [BODY.upperArm, BODY.lowerArm],
    },
    rightArm: {
      angles: [armSwingR, elbowBend],
      lengths: [BODY.upperArm, BODY.lowerArm],
    },
    torsoLean,
    headNod,
    torsoHeightOffset,
  };
}

/**
 * Draws the entire character in a given pose.
 */
function drawCharacter(pose) {
  const hipX = originX;
  const hipY = originY + 40 + pose.torsoHeightOffset;
  
  // --- LEG 1 ---
  drawLimb(hipX - 8, hipY, pose.leftLeg.angles, pose.leftLeg.lengths, '#ff6b6b', 8);

  // --- TORSO ---
  const shoulderX = hipX + Math.sin(pose.torsoLean) * BODY.torso;
  const shoulderY = hipY - Math.cos(pose.torsoLean) * BODY.torso;

  // --- ARM 1 ---
  drawLimb(shoulderX - 6, shoulderY, pose.leftArm.angles, pose.leftArm.lengths, '#4ecdc4', 7);
  
  ctx.strokeStyle = '#ffe66d';
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(hipX, hipY);
  ctx.lineTo(shoulderX, shoulderY);
  ctx.stroke();

  // --- LEG 2 ---
  drawLimb(hipX + 8, hipY, pose.rightLeg.angles, pose.rightLeg.lengths, '#ff6b6b', 8);
  
  // --- ARM 2 ---
  drawLimb(shoulderX + 6, shoulderY, pose.rightArm.angles, pose.rightArm.lengths, '#4ecdc4', 7);
  
  // --- HEAD ---
  const neckX = shoulderX + Math.sin(pose.torsoLean + pose.headNod) * 8;
  const neckY = shoulderY - Math.cos(pose.torsoLean + pose.headNod) * 8;
  const headX = neckX + Math.sin(pose.torsoLean + pose.headNod) * BODY.headRadius;
  const headY = neckY - Math.cos(pose.torsoLean + pose.headNod) * BODY.headRadius;
  
  // Neck
  ctx.strokeStyle = '#ffe66d';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(shoulderX, shoulderY);
  ctx.lineTo(neckX, neckY);
  ctx.stroke();
  
  // Head
  ctx.fillStyle = '#ffe66d';
  ctx.beginPath();
  ctx.arc(headX, headY, BODY.headRadius, 0, Math.PI * 2);
  ctx.fill();
  
  // Eye
  const eyeOffsetX = Math.sin(pose.torsoLean + pose.headNod) * 8 - 20;
  const eyeOffsetY = -Math.cos(pose.torsoLean + pose.headNod) * 8;
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.arc(headX + eyeOffsetX * 0.5, headY + eyeOffsetY * 0.5, 3, 0, Math.PI * 2);
  ctx.fill();
}

/**
 * Main animation loop.
 */
let lastTime = performance.now();

function animate(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  
  phase += dt * speedMultiplier * 4;
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Draw floor
  ctx.strokeStyle = '#0f3460';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(50, originY + 40 + BODY.upperLeg + BODY.lowerLeg);
  ctx.lineTo(canvas.width - 50, originY + 40 + BODY.upperLeg + BODY.lowerLeg);
  ctx.stroke();
  
  const pose = synthesizePose(phase);
  drawCharacter(pose);
  
  requestAnimationFrame(animate);
}

// Sliders Event Listeners
document.getElementById('speed').addEventListener('input', e => {
  speedMultiplier = parseFloat(e.target.value);
  updateDisplayValues();
});
document.getElementById('ampArms').addEventListener('input', e => {
  AMPLITUDES.arms = parseFloat(e.target.value);
  updateDisplayValues();
});
document.getElementById('ampKnees').addEventListener('input', e => {
  AMPLITUDES.knees = parseFloat(e.target.value);
  updateDisplayValues();
});
document.getElementById('ampTorso').addEventListener('input', e => {
  AMPLITUDES.torso = parseFloat(e.target.value);
  updateDisplayValues();
});
document.getElementById('ampLegs').addEventListener('input', e => {
  AMPLITUDES.legs = parseFloat(e.target.value);
  updateDisplayValues();
});
document.getElementById('torsoHeight').addEventListener('input', e => {
  jumpHeight = parseFloat(e.target.value);
  updateDisplayValues();
});
document.getElementById('frontRear').addEventListener('input', e => {
  const frVal = parseFloat(e.target.value);
  frontRear = (frVal)/2;
  rearFront = (2 - frVal)/2;
  updateDisplayValues();
});

// Initialize UI
initPresets();
updateDisplayValues();

requestAnimationFrame(animate);
</script>
</body>
</html>
